version: 2
updates:
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
